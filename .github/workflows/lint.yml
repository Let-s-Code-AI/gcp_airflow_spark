name: Lint

# Uruchamiany na PR-ach do main oraz jako workflow wielokrotnego użytku
# (uses: ./.github/workflows/lint.yml). Nie wymaga żadnych sekretów —
# korzysta wyłącznie z automatycznego tokenu tylko do odczytu.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.16.4"
  TFLINT_VERSION: "v0.66.0"
  RUFF_VERSION: "0.17.5"

jobs:
  terraform:
    name: Terraform (fmt, validate, TFLint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -diff -recursive terraform/

      - name: terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          tflint_wrapper: false

      - name: TFLint
        working-directory: terraform
        env:
          # Tylko do pobrania pluginu z GitHub Releases (limity API); to nie jest sekret z repo.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  python:
    name: Python (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check --output-format=github
