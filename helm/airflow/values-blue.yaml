# Slot BLUE — standby (nowa wersja czeka na przełączenie)
# Helm release: airflow-blue
# Wdrożenie: helm install airflow-blue apache-airflow/airflow -n airflow --version 1.15.0 -f values-blue.yaml
#
# UWAGA: scheduler startuje z replicas=0 żeby nie kolidować z green.
# Skrypt green-blue-switch.sh obsługuje skalowanie automatycznie.

airflowVersion: "2.10.2"
defaultAirflowTag: "2.10.2"

# Etykieta slotu — po tej wartości Service kieruje ruch
labels:
  slot: blue

executor: KubernetesExecutor

# Postgres zewnętrzny (StatefulSet postgres w tym samym namespace)
postgresql:
  enabled: false
redis:
  enabled: false

data:
  metadataConnection:
    user: airflow
    pass: airflow
    host: postgres.airflow.svc.cluster.local
    port: 5432
    db: airflow
    protocol: postgresql

# Scheduler wyłączony dopóki slot nie jest aktywny — unikamy podwójnego schedulera
scheduler:
  replicas: 0
  extraVolumes:
    - name: dags
      hostPath:
        path: /opt/airflow/dags
        type: Directory
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags

webserver:
  replicas: 2
  service:
    type: ClusterIP     # ruch przez airflow-active, nie bezpośrednio
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    password: admin
    email: admin@course.local
    firstName: Admin
    lastName: Instructor
  extraVolumes:
    - name: dags
      hostPath:
        path: /opt/airflow/dags
        type: Directory
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags

triggerer:
  extraVolumes:
    - name: dags
      hostPath:
        path: /opt/airflow/dags
        type: Directory
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags

workers:
  extraVolumes:
    - name: dags
      hostPath:
        path: /opt/airflow/dags
        type: Directory
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags

env:
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: "False"
